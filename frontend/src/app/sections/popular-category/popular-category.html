 
<section class="bg-[#F8FAFC] py-16">
  <div class="mx-auto max-w-[1200px] px-6">

    <!-- Section Header -->
    <div class="mb-10 text-center">
      <span
        class="mb-2 inline-block text-sm font-semibold uppercase tracking-[0.18em] text-[#29ABE2]"
      >
        Browse
      </span>

      <h2
        class="text-3xl font-bold tracking-tight text-[#16213E] sm:text-4xl"
      >
        Popular Categories
      </h2>

      <p class="mx-auto mt-3 max-w-lg text-sm leading-6 text-[#64748B]">
        Explore medicines and healthcare products by category.
      </p>
    </div>

    <!-- Categories -->
    <div
      class="grid grid-cols-2 gap-4 sm:grid-cols-4 lg:grid-cols-8"
    >

      <!-- Tablets -->
      <div
        class="group flex cursor-pointer flex-col items-center rounded-2xl border border-[#E3EDF3] bg-white px-4 py-5 transition-all duration-300 hover:-translate-y-1 hover:border-[#29ABE2]/30 hover:shadow-md"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#E8F7FC] text-[#29ABE2] transition-colors duration-300 group-hover:bg-[#29ABE2] group-hover:text-white"
        >
          <lucide-icon [img]="Pill" [size]="25"></lucide-icon>
        </div>

        <span class="text-sm font-semibold text-[#16213E]">
          Tablets
        </span>
      </div>

      <!-- Syrups -->
      <div
        class="group flex cursor-pointer flex-col items-center rounded-2xl border border-[#E3EDF3] bg-white px-4 py-5 transition-all duration-300 hover:-translate-y-1 hover:border-[#29ABE2]/30 hover:shadow-md"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#E8F7FC] text-[#29ABE2] transition-colors duration-300 group-hover:bg-[#29ABE2] group-hover:text-white"
        >
          <lucide-icon [img]="Bottle" [size]="25"></lucide-icon>
        </div>

        <span class="text-sm font-semibold text-[#16213E]">
          Syrups
        </span>
      </div>

      <!-- Devices -->
      <div
        class="group flex cursor-pointer flex-col items-center rounded-2xl border border-[#E3EDF3] bg-white px-4 py-5 transition-all duration-300 hover:-translate-y-1 hover:border-[#29ABE2]/30 hover:shadow-md"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#E8F7FC] text-[#29ABE2] transition-colors duration-300 group-hover:bg-[#29ABE2] group-hover:text-white"
        >
          <lucide-icon [img]="Stethoscope" [size]="25"></lucide-icon>
        </div>

        <span class="text-sm font-semibold text-[#16213E]">
          Devices
        </span>
      </div>

      <!-- Diabetes -->
      <div
        class="group flex cursor-pointer flex-col items-center rounded-2xl border border-[#E3EDF3] bg-white px-4 py-5 transition-all duration-300 hover:-translate-y-1 hover:border-[#29ABE2]/30 hover:shadow-md"

        >
          <lucide-icon [img]="Droplet" [size]="25"></lucide-icon>
        </div>

        <span class="text-sm font-semibold text-[#16213E]">
          Diabetes
        </span>
      </div>

      <!-- Eye Care -->
      <div
        class="group flex cursor-pointer flex-col items-center rounded-2xl border border-[#E3EDF3] bg-white px-4 py-5 transition-all duration-300 hover:-translate-y-1 hover:border-[#29ABE2]/30 hover:shadow-md"

        >

        <span class="text-sm font-semibold text-[#16213E]">

        </span>
      </div>

      <!-- First Aid -->

      >

        >
          <lucide-icon [img]="BriefcaseMedical" [size]="25"></lucide-icon>
        </div>

        <span class="text-sm font-semibold text-[#16213E]">
          First Aid
        </span>
      </div>

      <!-- Baby Care -->
      <div
        class="group flex cursor-pointer flex-col items-center rounded-2xl border border-[#E3EDF3] bg-white px-4 py-5 transition-all duration-300 hover:-translate-y-1 hover:border-[#29ABE2]/30 hover:shadow-md"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#E8F7FC] text-[#29ABE2] transition-colors duration-300 group-hover:bg-[#29ABE2] group-hover:text-white"

          <lucide-icon [img]="Baby" [size]="25"></lucide-icon>
        </div>

        <span class="text-sm font-semibold text-[#16213E]">
          Baby Care
        </span>
      </div>

      <!-- Fitness -->
      <div
        class="group flex cursor-pointer flex-col items-center rounded-2xl border border-[#E3EDF3] bg-white px-4 py-5 transition-all duration-300 hover:-translate-y-1 hover:border-[#29ABE2]/30 hover:shadow-md"
      >
        <div
          class="mb-3 flex h-14 w-14 items-center justify-center rounded-2xl bg-[#E8F7FC] text-[#29ABE2] transition-colors duration-300 group-hover:bg-[#29ABE2] group-hover:text-white"
        >
          <lucide-icon [img]="Dumbbell" [size]="25"></lucide-icon>
        </div>

        <span class="text-sm font-semibold text-[#16213E]">
          Fitness
        </span>
      </div>

    </div>
  </div>
</section>
