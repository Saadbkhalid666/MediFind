```html
<div
  class="min-h-screen flex items-center justify-center px-5 py-10 bg-gradient-to-b from-[#DCF3FB] via-[#F7F9FA] to-[#F7F9FA] font-['Inter',sans-serif]"
>
  <div class="max-w-[420px] w-full">

    <!-- Logo Header -->
    <div
      class="flex items-center gap-2 mb-6 font-['Poppins',sans-serif] font-bold text-xl text-[#16213E]"
    >
      <span
        class="w-[9px] h-[9px] rounded-full bg-[#29ABE2]"
      ></span>

      MediFind
    </div>

    <!-- Title -->
    <span
      class="text-xs text-[#29ABE2] font-bold tracking-wider uppercase"
    >
      VERIFY YOUR EMAIL
    </span>

    <h1
      class="font-['Poppins',sans-serif] text-2xl font-bold text-[#16213E] mt-1 mb-6"
    >
      Enter the 6-digit code
    </h1>

    <!-- OTP Card -->
    <div
      class="bg-white rounded-[18px] shadow-[0_8px_24px_rgba(22,33,62,0.08)] p-7"
    >

      <!-- Email Message -->
      <p class="text-sm text-[#6B7280] mb-4">
        We sent a verification code to
        <strong
          class="text-[#16213E] font-semibold"
        >
          {{ email }}
        </strong>
      </p>

      <!-- Error -->
      <div
        *ngIf="errorMessage"
        class="mb-4 p-3 rounded-lg bg-red-50 text-red-600 text-sm"
      >
        {{ errorMessage }}
      </div>

      <!-- Success -->
      <div
        *ngIf="successMessage"
        class="mb-4 p-3 rounded-lg bg-green-50 text-green-600 text-sm"
      >
        {{ successMessage }}
      </div>

      <form
        [formGroup]="otpForm"
        (ngSubmit)="onSubmit()"
      >

        <!-- OTP Inputs -->
        <div
          class="flex gap-2 mb-5"
          formArrayName="digits"
        >
          <input
            *ngFor="
              let digitControl of digitsControls.controls;
              let i = index
            "
            #otpInput
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="1"
            [formControlName]="i"
            (input)="onInput($event, i)"
            (keydown)="onKeyDown($event, i)"
            class="w-[44px] h-[48px] text-center font-bold text-base text-[#16213E] bg-[#F7F9FA] border border-[#e6eaee] rounded-[10px] focus:outline-none focus:border-[#29ABE2] transition duration-150"
          />
        </div>

        <!-- Verify Button -->
        <button
          type="submit"
          [disabled]="otpForm.invalid || loading"
          class="w-full bg-[#29ABE2] text-white rounded-full py-3 font-semibold text-sm hover:bg-[#1E8FC4] disabled:opacity-50 disabled:cursor-not-allowed transition duration-200 shadow-md"
        >
          <span *ngIf="!loading">
            Verify & Continue
          </span>

          <span *ngIf="loading">
            Verifying...
          </span>
        </button>

      </form>

      <!-- Resend Code -->
      <p
        class="text-center text-xs text-[#6B7280] mt-4"
      >
        Didn't get a code?

        <button
          type="button"
          (click)="resendCode()"
          [disabled]="!canResend || resendLoading"
          [ngClass]="
            canResend && !resendLoading
              ? 'text-[#29ABE2] cursor-pointer hover:underline'
              : 'text-[#6B7280] cursor-not-allowed'
          "
          class="font-semibold bg-transparent border-none p-0 outline-none"
        >

          <span *ngIf="!canResend">
            Resend in
            {{ (countdown / 60) | number:'2.0-0' }}:{{
              countdown % 60 < 10
                ? '0' + (countdown % 60)
                : countdown % 60
            }}
          </span>

          <span *ngIf="canResend && !resendLoading">
            Resend Code
          </span>

          <span *ngIf="resendLoading">
            Sending...
          </span>

        </button>
      </p>

    </div>
  </div>
</div>
```
