<div class="min-h-screen flex items-center justify-center px-5 py-10 bg-gradient-to-b from-[#DCF3FB] via-[#F7F9FA] to-[#F7F9FA] font-['Inter',sans-serif]">
  <div class="max-w-[420px] w-full">

    <!-- Logo Header -->
    <div class="flex items-center gap-2 mb-6 font-['Poppins',sans-serif] font-bold text-xl text-[#16213E]">
      <span class="w-[9px] h-[9px] rounded-full bg-[#29ABE2]"></span>
      MediFind
    </div>

    <!-- Title Tagline -->
    <span class="text-xs text-[#29ABE2] font-bold tracking-wider uppercase">VERIFY YOUR NUMBER</span>
    <h1 class="font-['Poppins',sans-serif] text-2xl font-bold text-[#16213E] mt-1 mb-6">
      Enter the 6-digit code
    </h1>

    <!-- OTP Verification Card -->
    <div class="bg-white rounded-[18px] shadow-[0_8px_24px_rgba(22,33,62,0.08)] p-7">
      
      <p class="text-sm text-[#6B7280] mb-4">
        We sent a code to <strong class="text-[#16213E] font-semibold">{{ phoneNumber }}</strong>
      </p>

      <form [formGroup]="otpForm" (ngSubmit)="onSubmit()">
        
        <!-- OTP Input Grid -->
        <div class="flex gap-2 mb-5" formArrayName="digits">
          <input
            *ngFor="let digitControl of digitsControls.controls; let i = index"
            #otpInput
            type="text"
            maxlength="1"
            [formControlName]="i"
            (input)="onInput($event, i)"
            (keydown)="onKeyDown($event, i)"
            class="w-[44px] h-[48px] text-center font-bold text-base text-[#16213E] bg-[#F7F9FA] border border-[#e6eaee] rounded-[10px] focus:outline-none focus:border-[#29ABE2] transition duration-150">
        </div>

        <!-- Submit Button -->
        <button 
          type="submit" 
          [disabled]="otpForm.invalid"
          class="w-full bg-[#29ABE2] text-white rounded-full py-3 font-semibold text-sm hover:bg-[#1E8FC4] disabled:opacity-50 disabled:cursor-not-allowed transition duration-200 shadow-md">
          Verify & Continue
        </button>

      </form>

      <!-- Resend Code Timer -->
      <p class="text-center text-xs text-[#6B7280] mt-4">
        Didn't get a code? 
        <button 
          type="button"
          (click)="resendCode()"
          [disabled]="!canResend"
          [ngClass]="canResend ? 'text-[#29ABE2] cursor-pointer hover:underline' : 'text-[#6B7280] cursor-not-allowed'"
          class="font-semibold bg-transparent border-none p-0 outline-none">
          <span *ngIf="!canResend">Resend in 00:{{ countdown < 10 ? '0' + countdown : countdown }}</span>
          <span *ngIf="canResend">Resend Code</span>
        </button>
      </p>

    </div>

  </div>
</div>
